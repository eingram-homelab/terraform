---
name: PR Workflow / Terraform

on:
  pull_request:
    branches:
      - update-release-workflow

permissions:
  contents: read

jobs:
  flattened-terraform-pr-workflow:
    if: ${{ github.event_name == 'pull_request' }}
    name: Terraform PR Workflow
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    uses: eingram-homelab/reusable-workflows/.github/workflows/_flattened-terraform-pr-workflow.yaml@update-release-workflow
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.head_ref || github.ref_name }}
      pull_request_number: ${{ github.event.pull_request.number }}
    secrets:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
