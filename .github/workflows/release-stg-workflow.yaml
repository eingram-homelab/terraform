---
name: Release Staging Workflow / Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-id:
        description: "Run ID of the PR Workflow / Terraform run to apply"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  resolve-run:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find PR Workflow run for merge commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # github.sha is the merge/squash commit on main, not the PR branch's head sha the PR workflow ran against
          pr_head_sha=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha')
          if [ -z "$pr_head_sha" ]; then
            echo "No merged PR found for merge commit ${{ github.sha }}" >&2
            exit 1
          fi

          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "PR Workflow / Terraform" \
            --commit "$pr_head_sha" \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful PR Workflow run found for PR head $pr_head_sha" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  flattened-terraform-release-workflow:
    needs: [resolve-run]
    if: ${{ always() && github.event_name == 'workflow_dispatch' || needs.resolve-run.result == 'success' }}
    name: Terraform Release Workflow
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: eingram-homelab/reusable-workflows/.github/workflows/_flattened-terraform-release-workflow.yaml@deploy-stg
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      environment: staging
      run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run-id || needs.resolve-run.outputs.run-id }}
    secrets:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
